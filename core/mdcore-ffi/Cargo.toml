[package]
name = "mdcore-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "mdcore_ffi"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
mdcore = { path = "../mdcore" }
uniffi = { version = "0.32", features = ["cli"] }
thiserror = "2"
