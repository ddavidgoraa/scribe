# cargo-deny: supply-chain checks for the Rust core (run in CI and via `make audit`).

[graph]
targets = ["aarch64-apple-darwin"]
all-features = true

[advisories]
# Known vulnerabilities (RustSec) fail the build; unmaintained crates are reported.
version = 2
yanked = "deny"
ignore = [
    # basic-toml is unmaintained; it is only used by askama inside the UniFFI code
    # generator (the build-time `uniffi-bindgen` tool), never in the shipped app.
    { id = "RUSTSEC-2026-0374", reason = "build-time code generator only, not shipped" },
]

[licenses]
version = 2
# Permissive licenses compatible with distributing Scribe under MIT.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# Only crates.io; no git dependencies or other registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
