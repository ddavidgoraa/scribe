name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: make test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build Release app
        run: |
          make core project
          xcodebuild -project app/Scribe.xcodeproj -scheme Scribe -configuration Release \
            -destination 'platform=macOS,arch=arm64' -derivedDataPath app/build build
      - name: Package DMG
        run: |
          mkdir -p dist/dmg
          cp -R app/build/Build/Products/Release/Scribe.app dist/dmg/
          ln -s /Applications dist/dmg/Applications
          hdiutil create -volname Scribe -srcfolder dist/dmg -ov -format UDZO \
            "dist/Scribe-${GITHUB_REF_NAME}-arm64.dmg"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --generate-notes
