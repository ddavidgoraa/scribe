name: CI

# Tests run on pull requests only (macOS runner minutes count 10x in private repos).
# Pushing a v* tag builds and publishes the DMG without re-running the tests.
on:
  pull_request:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  test:
    if: github.event_name != 'push'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Test
        run: make test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build DMG
        run: ./scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg --generate-notes
