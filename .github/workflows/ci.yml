name: CI

# Checks for every pull request (and on demand). Releases are built by release.yml.
#
# Hardening:
# - the GITHUB_TOKEN is read-only; no job here can write to the repository;
# - third-party actions are pinned to full commit SHAs (Dependabot keeps them current);
# - tools are pinned and checksum-verified; Rust builds use the committed Cargo.lock;
# - nothing here uses `pull_request_target`, so forked PRs never see a write token;
# - the workflows themselves are checked by actionlint and zizmor.
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: core/Cargo.toml
          command: check advisories bans licenses sources

  workflows:
    name: Workflow security (actionlint, zizmor)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install actionlint (pinned, checksum-verified)
        run: ./scripts/install-actionlint.sh >> "$GITHUB_PATH"
      - name: actionlint
        run: actionlint -color
      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.32.0
          advanced-security: false   # print findings in the log; no write permission needed

  test:
    name: Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: core
      - name: Install XcodeGen (pinned, checksum-verified)
        run: ./scripts/install-xcodegen.sh >> "$GITHUB_PATH"
      - name: Test
        run: make test
