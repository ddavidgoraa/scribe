name: Release

# A v* tag (only admins may create one) builds and publishes the DMG.
#
# Hardening:
# - no caches: everything that ends up in a release is built from scratch, so a poisoned
#   cache from another run can't influence it;
# - the dependency check and the full test suite run again on the tagged commit;
# - publishing waits for the maintainer's approval in the protected `release` environment;
# - only the publishing job gets write permissions; actions are pinned to commit SHAs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  supply-chain:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          manifest-path: core/Cargo.toml
          command: check advisories bans licenses sources

  test:
    name: Tests
    runs-on: macos-26
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Install XcodeGen (pinned, checksum-verified)
        run: ./scripts/install-xcodegen.sh >> "$GITHUB_PATH"
      - name: Test
        run: make test

  release:
    name: Release
    needs: [supply-chain, test]
    runs-on: macos-26
    # Protected environment: the job waits until the maintainer approves it on GitHub,
    # so a pushed tag alone can't publish a release.
    environment: release
    permissions:
      contents: write       # create the GitHub release
      id-token: write       # sign the build provenance attestation
      attestations: write   # store it
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin
      - name: Install XcodeGen (pinned, checksum-verified)
        run: ./scripts/install-xcodegen.sh >> "$GITHUB_PATH"
      - name: Build DMG
        run: ./scripts/make-dmg.sh "${GITHUB_REF_NAME#v}"
      - name: Checksums
        run: cd dist && shasum -a 256 -- *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.dmg
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt --generate-notes --verify-tag
