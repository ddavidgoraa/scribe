name: Scribe
options:
  bundleIdPrefix: dev.dawidgora
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: NO
packages:
  MdCore:
    path: Packages/MdCore
  SwiftMath:
    url: https://github.com/mgriebling/SwiftMath
    exactVersion: 1.7.3 # pinned; bump deliberately after review
targets:
  Scribe:
    type: application
    platform: macOS
    sources:
      - path: Scribe
      # The user guides, shown in the in-app Help window.
      - path: ../docs
        type: folder
        buildPhase: resources
    dependencies:
      - package: MdCore
      - package: SwiftMath
    # App Sandbox: the app reaches only what the user picks (the library folder, files
    # opened or dropped) and its own container. This is the source of truth: XcodeGen
    # rewrites Scribe.entitlements from these properties, so edit them here.
    entitlements:
      path: Scribe/Scribe.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Required by WebKit's helper processes for the Help window, even for local
        # content. Scribe's own code makes no network connections, and the Help view
        # blocks all web requests (HelpWebSecurity).
        com.apple.security.network.client: true
        # Printing (File → Print): without it the sandbox hides the printers and the
        # print panel never appears.
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.dawidgora.scribe
        PRODUCT_NAME: Scribe
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Scribe
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 Dawid Góra. MIT License."
        ENABLE_APP_SANDBOX: YES
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
      configs:
        Release:
          # No debugger attachment (get-task-allow) in shipped builds.
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
  ScribeTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ScribeTests]
    dependencies:
      - target: Scribe
      - package: MdCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
schemes:
  Scribe:
    build:
      targets:
        Scribe: all
        ScribeTests: [test]
    test:
      targets: [ScribeTests]
